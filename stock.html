<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison Al Teeb — Gestion de Stock</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script>
<style>
:root{--g:#0e291b;--gl:#153c28;--gold:#d4af37;--bg:#f7f4ee;--card:#fff;--muted:#68716b;--red:#a93232;--line:#e7e0d2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1d2821;font-family:Tajawal,Arial,sans-serif}.top{background:var(--g);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-family:Georgia,serif;color:var(--gold);font-size:22px;font-weight:700}.top a,.top button{border:1px solid #ffffff33;background:transparent;color:#fff;border-radius:9px;padding:9px 13px;text-decoration:none;cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap;margin-bottom:20px}.head h1{margin:0 0 5px;font-size:28px}.sub{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 5px 20px #0e291b0a}.stat b{font-size:28px;display:block;margin-top:7px}.stat small{color:var(--muted)}.toolbar{background:var(--card);padding:15px;border:1px solid var(--line);border-radius:15px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}input,select{border:1px solid #d9d2c5;border-radius:10px;padding:11px 13px;font:inherit;background:#fff}#search{flex:1;min-width:210px}.table-card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:12px;border-bottom:1px solid #eee;text-align:right;vertical-align:middle}th{background:#fbf9f5;color:var(--muted);font-size:13px}.prod{display:flex;align-items:center;gap:10px}.prod img{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#eee}.stockbox{display:flex;align-items:center;gap:6px}.stockbox button{width:32px;height:32px;border:1px solid #ddd;background:#f8f7f4;border-radius:8px;cursor:pointer;font-weight:700}.stocknum{min-width:45px;text-align:center;font-weight:700}.low{color:#9b6a00;font-weight:700}.out{color:var(--red);font-weight:700}.ok{color:#28724a;font-weight:700}.save{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}.threshold{width:75px}.msg{padding:12px;margin-bottom:12px;border-radius:10px;display:none}.success{background:#e8f5ed;color:#24603e}.error{background:#fbeaea;color:#8e2c2c}.login{max-width:430px;margin:10vh auto;background:#fff;padding:28px;border-radius:18px;border:1px solid var(--line);box-shadow:0 15px 50px #00000012}.login h1{color:var(--g);margin-top:0}.login button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:var(--g);color:#fff;font:inherit;cursor:pointer}.hidden{display:none!important}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.head h1{font-size:23px}}@media(max-width:430px){.stats{grid-template-columns:1fr 1fr}.stat b{font-size:23px}}
</style></head><body>
<div id="login" class="login"><div class="brand">MAISON AL TEEB</div><h1>Gestion de Stock</h1><p class="sub">تسجيل الدخول للولوج إلى مخزون المتجر</p><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" style="width:100%;margin-bottom:10px"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" style="width:100%"><button onclick="login()">دخول إلى إدارة المخزون</button><div id="loginMsg" class="sub" style="margin-top:12px"></div></div>
<div id="app" class="hidden"><div class="top"><div class="brand">MAISON AL TEEB</div><div><a href="/admin.html">الإدارة</a> <a href="/">المتجر</a> <button onclick="logout()">خروج</button></div></div><main class="wrap"><div class="head"><div><h1>Gestion de Stock</h1><div class="sub">تتبع الكمية والتنبيه على المنتجات القريبة من النفاد</div></div><button class="save" onclick="loadProducts()">↻ تحديث</button></div><div id="msg" class="msg"></div><section class="stats"><div class="stat"><small>عدد المنتجات</small><b id="sProducts">0</b></div><div class="stat"><small>مجموع المخزون</small><b id="sStock">0</b></div><div class="stat"><small>مخزون منخفض</small><b id="sLow">0</b></div><div class="stat"><small>نفد المخزون</small><b id="sOut">0</b></div></section><div class="toolbar"><input id="search" placeholder="🔎 بحث عن منتج..." oninput="render()"><select id="category" onchange="render()"><option value="">كل الفئات</option></select></div><div class="table-card"><table><thead><tr><th>المنتج</th><th>الفئة</th><th>الثمن</th><th>المخزون</th><th>حد التنبيه</th><th>الحالة</th><th>حفظ</th></tr></thead><tbody id="rows"></tbody></table></div></main></div>
<script>
const sb=supabase.createClient(window.MAISON_SUPABASE.url,window.MAISON_SUPABASE.anonKey);let products=[];
async function login(){const e=email.value.trim(),p=password.value;loginMsg.textContent='جاري الدخول...';const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error){loginMsg.textContent='بيانات الدخول غير صحيحة أو الحساب غير موجود.';return}showApp()}
async function logout(){await sb.auth.signOut();location.reload()}
async function showApp(){login.classList.add('hidden');app.classList.remove('hidden');await loadProducts()}
sb.auth.getSession().then(({data})=>{if(data.session)showApp()});
async function loadProducts(){const {data,error}=await sb.from('products').select('id,name,name_fr,category,price,image_url,stock,low_stock_threshold,active').order('id',{ascending:false});if(error){flash(error.message,true);return}products=data||[];buildCategories();render()}
function buildCategories(){const c=document.getElementById('category'),old=c.value;const cats=[...new Set(products.map(p=>p.category).filter(Boolean))];c.innerHTML='<option value="">كل الفئات</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');c.value=old}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),cat=document.getElementById('category').value;let list=products.filter(p=>(!q||(p.name||'').toLowerCase().includes(q)||(p.name_fr||'').toLowerCase().includes(q))&&(!cat||p.category===cat));rows.innerHTML=list.map(p=>{const st=Number(p.stock||0),th=Number(p.low_stock_threshold||5),status=st<=0?'<span class="out">نفد</span>':st<=th?'<span class="low">منخفض</span>':'<span class="ok">متوفر</span>';return `<tr><td><div class="prod">${p.image_url?`<img src="${esc(p.image_url)}">`:'<div style="width:52px;height:52px"></div>'}<div><b>${esc(p.name)}</b><br><small class="sub">${p.active?'نشط':'غير نشط'}</small></div></div></td><td>${esc(p.category||'—')}</td><td>${Number(p.price||0).toFixed(2)} DH</td><td><div class="stockbox"><button onclick="change(${p.id},-1)">−</button><span class="stocknum" id="n${p.id}">${st}</span><button onclick="change(${p.id},1)">+</button></div></td><td><input class="threshold" type="number" min="0" id="t${p.id}" value="${th}"></td><td id="status${p.id}">${status}</td><td><button class="save" onclick="save(${p.id})">حفظ</button></td></tr>`}).join('');updateStats()}
function change(id,d){const p=products.find(x=>x.id===id);p.stock=Math.max(0,Number(p.stock||0)+d);document.getElementById('n'+id).textContent=p.stock;const th=Number(document.getElementById('t'+id).value||5);document.getElementById('status'+id).innerHTML=p.stock<=0?'<span class="out">نفد</span>':p.stock<=th?'<span class="low">منخفض</span>':'<span class="ok">متوفر</span>';updateStats()}
async function save(id){const p=products.find(x=>x.id===id),th=Math.max(0,Number(document.getElementById('t'+id).value||0));const {error}=await sb.from('products').update({stock:Math.max(0,Number(p.stock||0)),low_stock_threshold:th,updated_at:new Date().toISOString()}).eq('id',id);if(error)flash(error.message,true);else flash('تم حفظ مخزون المنتج بنجاح');updateStats()}
function updateStats(){sProducts.textContent=products.length;sStock.textContent=products.reduce((a,p)=>a+Number(p.stock||0),0);sLow.textContent=products.filter(p=>Number(p.stock||0)>0&&Number(p.stock||0)<=Number(p.low_stock_threshold||5)).length;sOut.textContent=products.filter(p=>Number(p.stock||0)<=0).length}
function flash(t,err=false){msg.textContent=t;msg.className='msg '+(err?'error':'success');msg.style.display='block';setTimeout(()=>msg.style.display='none',3500)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
