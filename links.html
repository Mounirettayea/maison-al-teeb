<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="description" content="Maison Al Teeb — tous nos liens officiels." />
  <title>Maison Al Teeb — Liens officiels</title>
  <style>
    :root{--bg:#090909;--card:#151515;--gold:#c9a45c;--gold2:#e5c985;--text:#fff;--muted:#b9b9b9;--line:rgba(201,164,92,.22)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#242017 0,#0d0d0d 38%,#070707 100%);color:var(--text);font-family:Arial,"Noto Sans Arabic",sans-serif;display:flex;justify-content:center;padding:24px 14px 40px}
    .page{width:100%;max-width:520px;text-align:center;position:relative}
    .ornament{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:8px 0 26px}
    .mark{width:82px;height:82px;border:1px solid var(--gold);border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;color:var(--gold2);font-size:27px;font-family:Georgia,serif;box-shadow:0 0 35px rgba(201,164,92,.12)}
    h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:3px;font-size:27px;margin:0 0 7px}
    .arabic{font-size:20px;color:var(--gold2);margin-bottom:9px}
    .tag{font-size:12px;letter-spacing:1.4px;color:var(--muted);margin-bottom:25px}
    .links{display:grid;gap:11px}
    a.btn{display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--text);background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:58px;transition:.2s ease;box-shadow:0 8px 24px rgba(0,0,0,.18)}
    a.btn:hover{transform:translateY(-2px);border-color:rgba(201,164,92,.55);background:rgba(201,164,92,.08)}
    .icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;border:1px solid rgba(201,164,92,.35);color:var(--gold2);font-weight:700;flex:0 0 34px}
    .label{text-align:left;font-weight:700;font-size:14px;flex:1}.sub{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:3px}
    .qr{margin:24px auto 0;background:#fff;padding:12px;border-radius:16px;width:154px;box-shadow:0 12px 35px rgba(0,0,0,.3)}
    #qrcode{width:130px;height:130px;margin:auto}.qr small{display:block;color:#222;font-weight:700;font-size:10px;margin-top:8px;letter-spacing:1px}
    footer{margin-top:24px;color:#777;font-size:10px;letter-spacing:1px}
    [dir="rtl"] .label{text-align:right}
  </style>
</head>
<body>
  <main class="page">
    <div class="ornament"></div>
    <div class="mark">M</div>
    <h1>MAISON AL TEEB</h1>
    <div class="arabic">دار الطيب</div>
    <div class="tag">PARFUMS • HUILES AROMATIQUES • COSMÉTIQUES</div>

    <section class="links" aria-label="Liens officiels">
      <a class="btn" href="https://www.maisonalteeb.ma" target="_blank" rel="noopener"><span class="icon">⌂</span><span class="label">Site Web<span class="sub">www.maisonalteeb.ma</span></span></a>
      <a class="btn" href="https://www.facebook.com/maisonalteeb" target="_blank" rel="noopener"><span class="icon">f</span><span class="label">Facebook<span class="sub">@maisonalteeb</span></span></a>
      <a class="btn" href="https://www.tiktok.com/@Maisonalteeb0" target="_blank" rel="noopener"><span class="icon">♪</span><span class="label">TikTok<span class="sub">@Maisonalteeb0</span></span></a>
      <a class="btn" href="https://wa.me/212761774209" target="_blank" rel="noopener"><span class="icon">◉</span><span class="label">WhatsApp<span class="sub">0761774209</span></span></a>
      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=Settat%2C%20Morocco" target="_blank" rel="noopener"><span class="icon">⌖</span><span class="label">Localisation<span class="sub">Settat, Maroc • سطات، المغرب</span></span></a>
    </section>

    <div class="qr"><div id="qrcode"></div><small>SCAN ME • امسح هنا</small></div>
    <footer>Maison Al Teeb • Settat, Maroc</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>new QRCode(document.getElementById('qrcode'),{text:'https://www.maisonalteeb.ma/links.html',width:130,height:130,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});</script>
</body>
</html>
