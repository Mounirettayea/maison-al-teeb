name: Fix admin add-product scanner

on:
  push:
    paths:
      - '.github/workflows/fix-admin-scanner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix scanner syntax and verify login
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')

          # Critical fix: startBarcodeScanner uses await, so it MUST be async.
          s=s.replace('function startBarcodeScanner(){', 'async function startBarcodeScanner(){', 1)

          # Keep Add Product scanner available and make sure the loader is non-blocking.
          if 'function startAddBarcodeScanner()' not in s:
              raise SystemExit('Add Product scanner function missing')
          if 'id="addBarcodeReader"' not in s or 'id="barcode"' not in s:
              raise SystemExit('Add Product scanner UI missing')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          grep -q 'async function startBarcodeScanner()' admin.html
          grep -q 'function startAddBarcodeScanner()' admin.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix: restore admin login by fixing scanner syntax'
          git push
