name: Fix admin scanner

on:
  push:
    paths:
      - '.github/workflows/fix-admin-scanner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair Add Product scanner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          # Remove the old scanner implementations used by the Add Product form.
          # The previous workflow used over-escaped regexes, so duplicates were
          # never actually removed.
          s = re.sub(
              r'<button\b[^>]*(?:onclick\s*=\s*["\'](?:async\s+)?startBarcodeScanner\s*\(\s*\)["\']|onclick\s*=\s*["\'](?:async\s+)?startAddBarcodeScanner\s*\(\s*\)["\'])[^>]*>.*?</button>',
              '', s, flags=re.I | re.S
          )

          # Remove old scanner functions so only the new implementation remains.
          for name in ('startBarcodeScanner', 'startAddBarcodeScanner'):
              pattern = re.compile(
                  rf'(?:async\s+)?function\s+{name}\s*\([^)]*\)\s*\{{', re.I
              )
              while True:
                  m = pattern.search(s)
                  if not m:
                      break
                  depth = 0
                  end = None
                  for i in range(m.end() - 1, len(s)):
                      if s[i] == '{':
                          depth += 1
                      elif s[i] == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  if end is None:
                      raise SystemExit(f'Could not safely remove {name}')
                  s = s[:m.start()] + s[end:]

          # Make sure the scanner library is available before the page scripts run.
          s = s.replace(
              '<script src="https://unpkg.com/html5-qrcode" defer></script>',
              '<script src="https://unpkg.com/html5-qrcode"></script>'
          )

          # Remove previously injected scanner markup, if any.
          s = re.sub(r'<div[^>]*id=["\']addBarcodeStatus["\'][^>]*>.*?</div>', '', s, flags=re.I | re.S)
          s = re.sub(r'<div[^>]*id=["\']addBarcodeReader["\'][^>]*>.*?</div>', '', s, flags=re.I | re.S)
          s = re.sub(r'<button[^>]*id=["\']startAddBarcodeScannerBtn["\'][^>]*>.*?</button>', '', s, flags=re.I | re.S)

          # Find the barcode input in the Add Product form and attach exactly one scanner.
          barcode = re.compile(r'<input\b(?=[^>]*\bid=["\']barcode["\'])[^>]*>', re.I | re.S)
          m = barcode.search(s)
          if not m:
              raise SystemExit('Barcode input not found in admin.html')

          controls = '''
          <button type="button" id="startAddBarcodeScannerBtn" class="btn gold" onclick="startAddBarcodeScanner()">📷 Scanner</button>
          <div id="addBarcodeStatus" class="scanner-status">اضغط Scanner لفتح الكاميرا وقراءة Barcode</div>
          <div id="addBarcodeReader" class="barcode-reader hidden"></div>'''
          s = s[:m.end()] + controls + s[m.end():]

          # Add one clean implementation immediately before </body>.
          scanner_js = '''
          <script>
          let addBarcodeScanner = null;

          async function startAddBarcodeScanner() {
            const reader = document.getElementById('addBarcodeReader');
            const status = document.getElementById('addBarcodeStatus');
            const input = document.getElementById('barcode');

            if (!reader || !input) {
              alert('Scanner: champ Barcode introuvable');
              return;
            }
            if (typeof Html5Qrcode === 'undefined') {
              if (status) status.textContent = 'Scanner غير متاح. حدّث الصفحة وحاول من جديد.';
              return;
            }

            try {
              if (addBarcodeScanner) {
                try { await addBarcodeScanner.stop(); } catch (_) {}
                try { await addBarcodeScanner.clear(); } catch (_) {}
                addBarcodeScanner = null;
              }

              reader.classList.remove('hidden');
              if (status) status.textContent = 'وجه الكاميرا نحو Barcode...';
              addBarcodeScanner = new Html5Qrcode('addBarcodeReader');

              await addBarcodeScanner.start(
                { facingMode: { exact: 'environment' } },
                { fps: 10, qrbox: { width: 280, height: 140 } },
                async decoded => {
                  input.value = decoded;
                  input.dispatchEvent(new Event('input', { bubbles: true }));
                  input.dispatchEvent(new Event('change', { bubbles: true }));
                  if (status) status.textContent = 'تم قراءة Barcode: ' + decoded;
                  try { await addBarcodeScanner.stop(); } catch (_) {}
                  try { await addBarcodeScanner.clear(); } catch (_) {}
                  addBarcodeScanner = null;
                  reader.classList.add('hidden');
                },
                () => {}
              );
            } catch (err) {
              if (status) status.textContent = 'ما قدرناش نفتحو الكاميرا. عطِ صلاحية Camera للمتصفح وحاول من جديد.';
              try { if (addBarcodeScanner) await addBarcodeScanner.clear(); } catch (_) {}
              addBarcodeScanner = null;
            }
          }

          function stopAddBarcodeScanner() {
            if (addBarcodeScanner) {
              addBarcodeScanner.stop().catch(() => {});
              addBarcodeScanner.clear().catch(() => {});
              addBarcodeScanner = null;
            }
            const reader = document.getElementById('addBarcodeReader');
            if (reader) reader.classList.add('hidden');
          }
          </script>
          '''
          s = s.replace('</body>', scanner_js + '\n</body>', 1)

          if s.count('id="startAddBarcodeScannerBtn"') != 1:
              raise SystemExit('Scanner button count is not 1')
          if s.count('id="addBarcodeReader"') != 1:
              raise SystemExit('Scanner reader count is not 1')
          if s.count('function startAddBarcodeScanner()') != 1:
              raise SystemExit('Scanner function count is not 1')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No admin changes needed'
            exit 0
          fi
          git commit -m 'fix: keep one working admin barcode scanner'
          git push
