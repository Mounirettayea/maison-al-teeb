name: Fix Add Product Barcode Scanner

on:
  push:
    paths:
      - '.github/workflows/fix-admin-scanner.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin scanner
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          if 'startAddBarcodeScanner' in s:
              print('Scanner already patched')
              raise SystemExit(0)
          m=re.search(r'<div class="searchbar" style="grid-template-columns:1fr 1fr">\s*<input id="name"[^>]*>\s*<input id="barcode"[^>]*>\s*</div>',s)
          if not m: raise SystemExit('Add Product barcode block not found')
          new='''<div class="searchbar" style="grid-template-columns:1fr 1fr">
            <input id="name" required placeholder="اسم المنتج *">
            <div>
              <div class="barcode-tools">
                <input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Barcode">
                <button class="btn dark" type="button" onclick="startAddBarcodeScanner()">📷 سكان</button>
              </div>
              <div class="barcode-help">وجّه الكاميرا للـBarcode وخليه داخل الإطار.</div>
              <div id="addBarcodeReader" class="barcode-reader hidden">
                <div id="addBarcodeReaderView"></div>
                <div id="addScannerStatus" class="scanner-status">جاري تشغيل الكاميرا...</div>
                <button class="btn danger" type="button" onclick="stopAddBarcodeScanner()" style="margin:8px">✕ إيقاف السكان</button>
              </div>
            </div>
          </div>'''
          s=s[:m.start()]+new+s[m.end():]
          if 'addBarcodeScanner' not in s:
              s=s.replace('let products=[],orders=[],orderItems=[],barcodeScanner=null;','let products=[],orders=[],orderItems=[],barcodeScanner=null,addBarcodeScanner=null;',1)
          pos=s.find('function startBarcodeScanner(){')
          if pos<0: raise SystemExit('scanner function not found')
          fn='''async function startAddBarcodeScanner(){
            if(!window.Html5Qrcode){flash('السكانر مازال كيتحمل، عاود ضغط سكان بعد لحظة.',true);return;}
            if(!window.isSecureContext && location.hostname!=='localhost'){flash('الكاميرا كتحتاج HTTPS باش تخدم.',true);return;}
            await stopAddBarcodeScanner(); $('addBarcodeReader').classList.remove('hidden'); $('addScannerStatus').textContent='جاري تشغيل الكاميرا...'; addBarcodeScanner=new Html5Qrcode('addBarcodeReaderView');
            try{
              const formats=window.Html5QrcodeSupportedFormats?[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF]:undefined;
              const config={fps:10,qrbox:{width:280,height:140},aspectRatio:1.777}; if(formats)config.formatsToSupport=formats;
              await addBarcodeScanner.start({facingMode:{ideal:'environment'}},config,async decodedText=>{const code=String(decodedText||'').trim();if(!code)return;$('barcode').value=code;$('addScannerStatus').textContent='تم التقاط Barcode: '+code;flash('تم سكان الـBarcode بنجاح ✅');await stopAddBarcodeScanner();$('barcode').focus();},()=>{});
            }catch(err){console.error(err);flash('ما قدرناش نشغلو الكاميرا. سمح للموقع باستعمال الكاميرا.',true);await stopAddBarcodeScanner();}
          }
          async function stopAddBarcodeScanner(){if(addBarcodeScanner){try{if(addBarcodeScanner.isScanning)await addBarcodeScanner.stop();}catch(e){}try{await addBarcodeScanner.clear();}catch(e){}addBarcodeScanner=null;}$('addBarcodeReader')?.classList.add('hidden');}

          '''
          s=s[:pos]+fn+s[pos:]
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: make add product barcode scanner work"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-admin-scanner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove temporary scanner fix workflow"
          git push