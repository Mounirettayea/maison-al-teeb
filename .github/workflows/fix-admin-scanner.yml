name: Fix admin scanner

on:
  push:
    paths:
      - '.github/workflows/fix-admin-scanner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Add Product scanner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          # Remove old Add Product scanner buttons and functions.
          s = re.sub(r'<button\b[^>]*(?:onclick\s*=\s*["\'](?:async\s+)?(?:startBarcodeScanner|startAddBarcodeScanner)\s*\([^)]*\)["\'])[^>]*>.*?</button>', '', s, flags=re.I | re.S)
          for name in ('startBarcodeScanner', 'startAddBarcodeScanner'):
              rx = re.compile(r'(?:async\s+)?function\s+' + name + r'\s*\([^)]*\)\s*\{', re.I)
              while True:
                  m = rx.search(s)
                  if not m:
                      break
                  depth = 0
                  end = None
                  for i in range(m.end() - 1, len(s)):
                      if s[i] == '{':
                          depth += 1
                      elif s[i] == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  if end is None:
                      raise SystemExit('Could not remove scanner function safely')
                  s = s[:m.start()] + s[end:]

          s = s.replace('<script src="https://unpkg.com/html5-qrcode" defer></script>', '<script src="https://unpkg.com/html5-qrcode"></script>')
          s = re.sub(r'<div[^>]*id=["\']addBarcodeStatus["\'][^>]*>.*?</div>', '', s, flags=re.I | re.S)
          s = re.sub(r'<div[^>]*id=["\']addBarcodeReader["\'][^>]*>.*?</div>', '', s, flags=re.I | re.S)
          s = re.sub(r'<button[^>]*id=["\']startAddBarcodeScannerBtn["\'][^>]*>.*?</button>', '', s, flags=re.I | re.S)

          m = re.search(r'<input\b(?=[^>]*\bid=["\']barcode["\'])[^>]*>', s, re.I | re.S)
          if not m:
              raise SystemExit('Barcode input not found in admin.html')

          controls = '\n<button type="button" id="startAddBarcodeScannerBtn" class="btn gold" onclick="startAddBarcodeScanner()">📷 Scanner</button>\n<div id="addBarcodeStatus" class="scanner-status">اضغط Scanner لفتح الكاميرا وقراءة Barcode</div>\n<div id="addBarcodeReader" class="barcode-reader hidden"></div>'
          s = s[:m.end()] + controls + s[m.end():]

          scanner = '''<script>
          let addBarcodeScanner = null;
          async function startAddBarcodeScanner() {
            const reader = document.getElementById('addBarcodeReader');
            const status = document.getElementById('addBarcodeStatus');
            const input = document.getElementById('barcode');
            if (!reader || !input) return alert('Scanner: champ Barcode introuvable');
            if (typeof Html5Qrcode === 'undefined') {
              if (status) status.textContent = 'Scanner غير متاح. حدّث الصفحة وحاول من جديد.';
              return;
            }
            try {
              if (addBarcodeScanner) {
                try { await addBarcodeScanner.stop(); } catch (_) {}
                try { await addBarcodeScanner.clear(); } catch (_) {}
              }
              reader.classList.remove('hidden');
              if (status) status.textContent = 'وجه الكاميرا نحو Barcode...';
              addBarcodeScanner = new Html5Qrcode('addBarcodeReader');
              await addBarcodeScanner.start(
                { facingMode: { exact: 'environment' } },
                { fps: 10, qrbox: { width: 280, height: 140 } },
                async decoded => {
                  input.value = decoded;
                  input.dispatchEvent(new Event('input', { bubbles: true }));
                  input.dispatchEvent(new Event('change', { bubbles: true }));
                  if (status) status.textContent = 'تم قراءة Barcode: ' + decoded;
                  try { await addBarcodeScanner.stop(); } catch (_) {}
                  try { await addBarcodeScanner.clear(); } catch (_) {}
                  addBarcodeScanner = null;
                  reader.classList.add('hidden');
                },
                () => {}
              );
            } catch (_) {
              if (status) status.textContent = 'ما قدرناش نفتحو الكاميرا. عطِ صلاحية Camera للمتصفح وحاول من جديد.';
              try { if (addBarcodeScanner) await addBarcodeScanner.clear(); } catch (_) {}
              addBarcodeScanner = null;
            }
          }
          function stopAddBarcodeScanner() {
            if (addBarcodeScanner) {
              addBarcodeScanner.stop().catch(() => {});
              addBarcodeScanner.clear().catch(() => {});
              addBarcodeScanner = null;
            }
            const reader = document.getElementById('addBarcodeReader');
            if (reader) reader.classList.add('hidden');
          }
          </script>'''
          scanner = '\n'.join(line.rstrip() for line in scanner.splitlines())
          s = s.replace('</body>', scanner + '\n</body>', 1)

          if s.count('id="startAddBarcodeScannerBtn"') != 1:
              raise SystemExit('Scanner button count is not 1')
          if s.count('id="addBarcodeReader"') != 1:
              raise SystemExit('Scanner reader count is not 1')
          if s.count('function startAddBarcodeScanner()') != 1:
              raise SystemExit('Scanner function count is not 1')

          # Remove trailing whitespace introduced by the generated markup.
          s = '\n'.join(line.rstrip() for line in s.split('\n'))
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No admin changes needed'
            exit 0
          fi
          git commit -m 'fix: keep one working admin barcode scanner'
          git push
