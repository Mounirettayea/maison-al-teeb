name: Fix admin scanner

on:
  push:
    paths:
      - '.github/workflows/fix-admin-scanner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep one working Add Product scanner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          # Remove every old button that calls the duplicate scanner.
          s = re.sub(
              r'<button\b[^>]*onclick=["\'](?:async\s+)?startBarcodeScanner\(\)["\'][^>]*>.*?</button>',
              '', s, flags=re.I | re.S
          )

          # Remove the old scanner function, whether it is declared async or not.
          for marker in ('async function startBarcodeScanner(){', 'function startBarcodeScanner(){'):
              pos = s.find(marker)
              if pos == -1:
                  continue
              depth = 0
              end = None
              for i in range(pos + len(marker) - 1, len(s)):
                  ch = s[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit('Could not safely remove old scanner function')
              s = s[:pos] + s[end:]

          # The Add Product scanner must be the only scanner implementation.
          if 'function startAddBarcodeScanner()' not in s:
              raise SystemExit('Add Product scanner function is missing')
          if 'id="addBarcodeReader"' not in s:
              raise SystemExit('Add Product scanner UI is missing')
          if 'startBarcodeScanner' in s:
              raise SystemExit('Duplicate old scanner still exists')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          grep -q 'function startAddBarcodeScanner()' admin.html
          grep -q 'id="addBarcodeReader"' admin.html
          ! grep -q 'startBarcodeScanner' admin.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix: keep one working barcode scanner'
          git push
