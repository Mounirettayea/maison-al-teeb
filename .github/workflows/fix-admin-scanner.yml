name: Fix admin scanner

on:
  push:
    paths:
      - '.github/workflows/fix-admin-scanner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep one scanner and remove duplicate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          # The newly added Add Product scanner is the one we keep.
          # Remove the old Edit Product scanner button(s) that call startBarcodeScanner().
          s = re.sub(
              r'<button\\b[^>]*onclick=["\']startBarcodeScanner\\(\\)["\'][^>]*>.*?</button>',
              '', s, flags=re.I | re.S
          )

          # Remove the old startBarcodeScanner() function safely by matching braces.
          marker = 'function startBarcodeScanner(){'
          pos = s.find(marker)
          if pos != -1:
              depth = 0
              end = None
              for i in range(pos + len(marker) - 1, len(s)):
                  ch = s[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit('Could not safely remove old scanner function')
              s = s[:pos] + s[end:]

          # Make sure exactly one scanner implementation remains.
          if s.count('startAddBarcodeScanner') < 1:
              raise SystemExit('Kept scanner function is missing')
          if 'startBarcodeScanner' in s:
              raise SystemExit('Old duplicate scanner still exists')
          if 'id="addBarcodeReader"' not in s:
              raise SystemExit('Kept scanner UI is missing')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          grep -q 'startAddBarcodeScanner' admin.html
          ! grep -q 'startBarcodeScanner' admin.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix: keep one working barcode scanner'
          git push
