name: Fix admin product update
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix update logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          text=p.read_text(encoding='utf-8')
          old="""  if(id){
    // Update an existing Supabase row first.
    result = await db.from('products').update(payload).eq('id',id);
    if(!result.error && (!result.data || result.data.length === 0)){
      // The product may only exist in the site's built-in catalog.
      // Create the same ID in Supabase so future changes sync to the public site.
      result = await db.from('products').insert({...payload,id});
    }
  } else {
    result = await db.from('products').insert(payload);
  }"""
          new="""  if(id){
    // Update the existing row and return its id. Supabase updates do not return
    // rows unless select() is requested; without it the old code incorrectly
    // treated a successful update as missing and tried to insert the same ID.
    result = await db.from('products').update(payload).eq('id',id).select('id').maybeSingle();
    if(!result.error && !result.data){
      // Product exists only in the built-in catalog: create it once with this ID.
      result = await db.from('products').insert({...payload,id});
    }
  } else {
    result = await db.from('products').insert(payload);
  }"""
          if old not in text:
              raise SystemExit('target update block not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-product-update.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html .github/workflows/fix-product-update.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix admin product editing duplicate ID error [skip ci]'
          git push
