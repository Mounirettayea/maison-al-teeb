name: Fix admin product update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix update logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          text=p.read_text(encoding='utf-8')
          start=text.index("  if(id){\n    // Update an existing Supabase row first.")
          end=text.index("  } else {\n    result = await db.from('products').insert(payload);\n  }", start)+len("  } else {\n    result = await db.from('products').insert(payload);\n  }")
          new="  if(id){\n    // Update the existing row and return its id.\n    result = await db.from('products').update(payload).eq('id',id).select('id').maybeSingle();\n    if(!result.error && !result.data){\n      // Product exists only in the built-in catalog: create it once with this ID.\n      result = await db.from('products').insert({...payload,id});\n    }\n  } else {\n    result = await db.from('products').insert(payload);\n  }"
          text=text[:start]+new+text[end:]
          p.write_text(text,encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-product-update.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html .github/workflows/fix-product-update.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix admin product editing duplicate ID error [skip ci]'
          git push
