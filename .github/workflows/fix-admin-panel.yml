name: Fix admin panel visibility

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-admin-panel.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix admin login visibility and mobile layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')

          mobile_css = r'''
          /* Mobile admin login: brand/logo first, form second */
          @media(max-width:700px){
            body.login-mode{overflow-x:hidden;overflow-y:auto;padding:14px 10px;}
            #loginCard{width:100%;min-height:0;margin:0 auto;display:flex;flex-direction:column;border-radius:20px;}
            #loginCard .login-brand{order:1;min-height:270px;padding:28px 20px 24px;border-left:0;border-bottom:1px solid rgba(212,168,76,.25);}
            #loginCard .login-brand:before{inset:14px;border-radius:16px;}
            #loginCard .login-brand img{width:150px;max-width:65%;height:auto;margin-bottom:12px;}
            #loginCard .login-brand h1{font-size:23px;letter-spacing:2px;}
            #loginCard .login-brand p{font-size:12px;line-height:1.7;margin-top:10px;}
            #loginCard .login-content{order:2;padding:30px 22px 28px;}
            #loginCard .login-content-inner{max-width:100%;}
            #loginCard .login-input{display:block;width:100%;}
          }
          @media(max-width:390px){
            body.login-mode{padding:8px 6px;}
            #loginCard .login-brand{min-height:245px;padding:24px 15px 20px;}
            #loginCard .login-brand img{width:135px;}
            #loginCard .login-brand h1{font-size:21px;}
            #loginCard .login-content{padding:26px 16px 24px;}
          }
          '''

          marker = '    @media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}table{font-size:13px}}'
          if mobile_css.strip() not in text:
              if marker not in text:
                  raise SystemExit('Mobile CSS marker not found')
              text = text.replace(marker, marker + '\n' + mobile_css, 1)

          old_login = "function showLogin(){$('loginCard').classList.remove('hidden');$('adminPanel').classList.add('hidden')}"
          new_login = "function showLogin(){$('loginCard').classList.remove('hidden');$('loginCard').style.display='grid';$('adminPanel').classList.add('hidden');$('adminPanel').style.display='none';window.scrollTo({top:0,left:0,behavior:'auto'})}"
          if old_login in text:
              text = text.replace(old_login, new_login, 1)

          old_admin = "async function showAdmin(){$('loginCard').classList.add('hidden');$('adminPanel').classList.remove('hidden');await load()}"
          new_admin = "async function showAdmin(){$('loginCard').classList.add('hidden');$('loginCard').style.display='none';$('adminPanel').classList.remove('hidden');$('adminPanel').style.display='block';window.scrollTo({top:0,left:0,behavior:'auto'});await load()}"
          if old_admin in text:
              text = text.replace(old_admin, new_admin, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-admin-panel.yml

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html .github/workflows/fix-admin-panel.yml
          git commit -m 'Hide admin login after authentication and fix mobile layout [skip ci]'
          git push
