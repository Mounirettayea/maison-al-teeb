name: Fix duplicated admin page

on:
  push:
    paths:
      - 'admin.html'
      - '.github/workflows/fix-admin-duplicate.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove duplicated HTML document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')
          marker = '</html>'
          first = text.find(marker)
          if first == -1:
              raise SystemExit('Could not find closing </html> tag')
          cleaned = text[:first + len(marker)].rstrip() + '\n'
          if cleaned != text:
              p.write_text(cleaned, encoding='utf-8')
          PY

      - name: Remove one-off workflow
        run: rm -f .github/workflows/fix-admin-duplicate.yml

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html .github/workflows/fix-admin-duplicate.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix duplicated admin login page [skip ci]'
          git push
