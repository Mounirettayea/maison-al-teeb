<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAISON AL TEEB — لوحة الإدارة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f2e8;color:#18352b;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1250px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font:700 24px Georgia;color:#b98d32}.tools,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}.dark{background:#18352b;color:#fff}.gold{background:#d8ad4e;color:#111}.light{background:#fff;color:#18352b;border:1px solid #ddd}.red{background:#a33;color:#fff}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 25px #0000000d}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat b{font-size:28px;display:block;margin-top:5px}.muted{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}textarea{min-height:100px}.full{grid-column:1/-1}.filters{display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px}.filters input,.filters select{padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right;vertical-align:middle}th{background:#faf8f2}.prod{display:flex;align-items:center;gap:10px}.pic{width:55px;height:55px;object-fit:cover;border-radius:9px;background:#eee}.qty{display:flex;align-items:center;gap:6px}.qty button{width:34px;height:34px;border:1px solid #ddd;background:#fafafa;border-radius:8px;cursor:pointer;font-size:18px}.qty input,.limit{width:70px;text-align:center;padding:8px;border:1px solid #ddd;border-radius:8px}.badge{padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700}.ok{background:#e7f5eb;color:#16713a}.low{background:#fff3d2;color:#8b6500}.out{background:#fde8e8;color:#a21e1e}.msg{padding:12px;border-radius:10px;margin:10px 0;display:none}.success{display:block;background:#e7f5eb;color:#176b38}.error{display:block;background:#fde8e8;color:#a21e1e}.login{max-width:440px;margin:10vh auto;background:#111;color:#fff;padding:30px;border-radius:22px}.login h1{color:#d8ad4e}.login input{background:#181818;color:#fff;border-color:#594722;margin:7px 0 15px}.hidden{display:none!important}.add-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.preview{width:90px;height:90px;object-fit:cover;border-radius:12px;border:1px solid #ddd;display:none}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="brand">MAISON AL TEEB</div><h1>لوحة الإدارة</h1><p>إضافة المنتجات وإدارة المخزون من نفس الصفحة.</p><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button class="btn gold" style="width:100%" onclick="login()">🔐 دخول</button><div id="loginMsg" class="muted"></div></div>
<div id="app" class="hidden"><main class="wrap">
<div class="top"><div><div class="brand">MAISON AL TEEB</div><h1>لوحة الإدارة</h1><span class="muted">إضافة المنتجات + Gestion de Stock في صفحة واحدة</span></div><div class="tools"><a class="btn light" href="/">المتجر</a><button class="btn dark" onclick="load()">↻ تحديث</button><button class="btn red" onclick="logout()">خروج</button></div></div><div id="msg" class="msg"></div>
<section class="stats"><div class="card"><span class="muted">كل المنتجات</span><b id="all">0</b></div><div class="card"><span class="muted">إجمالي القطع</span><b id="units">0</b></div><div class="card"><span class="muted">متوفر</span><b id="available">0</b></div><div class="card"><span class="muted">مخزون ضعيف</span><b id="low">0</b></div><div class="card"><span class="muted">نفد المخزون</span><b id="out">0</b></div></section>
<section class="card"><div class="add-title"><h2>➕ إضافة منتج جديد</h2><button class="btn light" onclick="resetForm()">تفريغ</button></div>
<form id="addForm" onsubmit="addProduct(event)"><div class="grid">
<input id="name" required placeholder="اسم المنتج *"><input id="name_fr" placeholder="Nom français"><input id="name_en" placeholder="English name"><select id="category" required><option value="العطور">العطور</option><option value="الزيوت">الزيوت</option><option value="العناية بالجسم">العناية بالجسم</option><option value="لباس تقليدي">لباس تقليدي</option><option value="مكملات غذائية">مكملات غذائية</option><option value="أخرى">أخرى</option></select><input id="gender" placeholder="الجنس"><input id="size" placeholder="الحجم / 100 ml"><input id="price" type="number" step="0.01" min="0" required placeholder="الثمن *"><input id="old_price" type="number" step="0.01" min="0" placeholder="الثمن القديم"><input id="discount" type="number" step="1" min="0" placeholder="التخفيض %"><input id="stock_new" type="number" min="0" value="0" placeholder="الكمية"><input id="threshold_new" type="number" min="0" value="5" placeholder="حد التنبيه"><input id="image_url" placeholder="رابط الصورة (اختياري)"><input id="image_file" type="file" accept="image/*"><img id="preview" class="preview"><textarea id="description" class="full" placeholder="وصف المنتج"></textarea></div><br><button class="btn gold" type="submit">💾 إضافة المنتج</button></form></section>
<section class="card"><div class="filters"><input id="search" class="search" placeholder="🔎 البحث بالاسم..." oninput="render()"><select id="cat" onchange="render()"><option value="">كل الفئات</option></select><select id="status" onchange="render()"><option value="">كل الحالات</option><option value="ok">متوفر</option><option value="low">مخزون ضعيف</option><option value="out">نفد المخزون</option></select><button class="btn gold" onclick="saveAll()">💾 حفظ الكل</button></div></section>
<section class="card" style="overflow:auto"><table><thead><tr><th>المنتج</th><th>الفئة</th><th>الثمن</th><th>الكمية</th><th>حد التنبيه</th><th>الحالة</th><th>حفظ</th></tr></thead><tbody id="body"></tbody></table></section>
</main></div>
<script>
const db=supabase.createClient(window.MAISON_SUPABASE.url,window.MAISON_SUPABASE.anonKey);let ps=[];const $=id=>document.getElementById(id);
async function login(){const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='بيانات الدخول غير صحيحة';return}show()}
async function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}
async function logout(){await db.auth.signOut();location.reload()}
db.auth.getSession().then(({data})=>{if(data.session)show()});
$('image_file').addEventListener('change',()=>{const f=$('image_file').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'}});
async function uploadImage(){const f=$('image_file').files[0];if(!f)return $('image_url').value.trim();const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path='products/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const {error}=await db.storage.from('products').upload(path,f,{upsert:false,contentType:f.type});if(error)throw new Error('رفع الصورة فـStorage فشل: '+error.message);const {data}=db.storage.from('products').getPublicUrl(path);return data.publicUrl}
async function addProduct(e){e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.textContent='⏳ جاري الإضافة...';try{const image=await uploadImage();const row={name:$('name').value.trim(),name_fr:$('name_fr').value.trim()||null,name_en:$('name_en').value.trim()||null,category:$('category').value,gender:$('gender').value.trim()||null,size:$('size').value.trim()||null,price:Number($('price').value),old_price:$('old_price').value?Number($('old_price').value):0,discount:$('discount').value?Number($('discount').value):0,image:image||null,description:$('description').value.trim()||null,stock:Math.max(0,Number($('stock_new').value)||0),low_stock_threshold:Math.max(0,Number($('threshold_new').value)||0),active:true};const {data,error}=await db.from('products').insert(row).select().single();if(error)throw new Error(error.message);flash('تمت إضافة المنتج بنجاح ✅');resetForm();await load()}catch(err){flash(err.message,true)}finally{btn.disabled=false;btn.textContent='💾 إضافة المنتج'}}
function resetForm(){$('addForm').reset();$('stock_new').value=0;$('threshold_new').value=5;$('preview').style.display='none';$('preview').src=''}
async function load(){const {data,error}=await db.from('products').select('id,name,name_fr,category,price,image,stock,low_stock_threshold,active').order('id',{ascending:true});if(error){flash(error.message,true);return}ps=(data||[]).map(p=>({...p,stock:Number(p.stock)||0,low_stock_threshold:Number(p.low_stock_threshold)||5}));const cats=[...new Set(ps.map(p=>p.category).filter(Boolean))];$('cat').innerHTML='<option value="">كل الفئات</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');render()}
function state(p){return p.stock<=0?'out':p.stock<=p.low_stock_threshold?'low':'ok'}function label(s){return s==='out'?'نفد المخزون':s==='low'?'مخزون ضعيف':'متوفر'}
function render(){const q=$('search').value.toLowerCase(),c=$('cat').value,s=$('status').value;const list=ps.filter(p=>(!q||(p.name||'').toLowerCase().includes(q)||(p.name_fr||'').toLowerCase().includes(q))&&(!c||p.category===c)&&(!s||state(p)===s));$('body').innerHTML=list.map(p=>{const st=state(p);return `<tr><td><div class="prod">${p.image?`<img class="pic" src="${esc(p.image)}" alt="">`:'<div class="pic"></div>'}<div><b>${esc(p.name||'بدون اسم')}</b><br><span class="muted">ID: ${p.id}</span></div></div></td><td>${esc(p.category||'—')}</td><td>${Number(p.price||0).toFixed(2)} DH</td><td><div class="qty"><button onclick="chg(${p.id},-1)">−</button><input id="q${p.id}" type="number" min="0" value="${p.stock}" onchange="setq(${p.id},this.value)"><button onclick="chg(${p.id},1)">+</button></div></td><td><input class="limit" id="t${p.id}" type="number" min="0" value="${p.low_stock_threshold}"></td><td><span class="badge ${st}">${label(st)}</span></td><td><button class="btn dark" onclick="save(${p.id})">حفظ</button></td></tr>`}).join('');stats()}
function find(id){return ps.find(p=>p.id===id)}function chg(id,n){const p=find(id);p.stock=Math.max(0,p.stock+n);render()}function setq(id,v){find(id).stock=Math.max(0,parseInt(v)||0);render()}
async function save(id){const p=find(id),th=Math.max(0,parseInt($('t'+id).value)||0);const {error}=await db.from('products').update({stock:p.stock,low_stock_threshold:th,updated_at:new Date().toISOString()}).eq('id',id);if(error)flash(error.message,true);else flash('تم حفظ التغيير بنجاح')}
async function saveAll(){for(const p of ps){const input=$('t'+p.id);if(input){const {error}=await db.from('products').update({stock:p.stock,low_stock_threshold:Math.max(0,parseInt(input.value)||0),updated_at:new Date().toISOString()}).eq('id',p.id);if(error){flash(error.message,true);return}}}flash('تم حفظ جميع تغييرات المخزون')}
function stats(){$('all').textContent=ps.length;$('units').textContent=ps.reduce((a,p)=>a+p.stock,0);$('available').textContent=ps.filter(p=>state(p)==='ok').length;$('low').textContent=ps.filter(p=>state(p)==='low').length;$('out').textContent=ps.filter(p=>state(p)==='out').length}
function flash(t,e=false){$('msg').textContent=t;$('msg').className='msg '+(e?'error':'success');$('msg').style.display='block';setTimeout(()=>$('msg').style.display='none',3500)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
