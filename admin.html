<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MAISON AL TEEB — الإدارة</title>
  <style>
    body{margin:0;font-family:Arial,"Tahoma",sans-serif;background:#f7f2e8;color:#18352b}
    body.login-mode{min-height:100vh;background:radial-gradient(circle at 20% 50%,rgba(212,168,76,.12),transparent 30%),radial-gradient(circle at 80% 20%,rgba(212,168,76,.10),transparent 30%),#080808}
    .wrap{max-width:1100px;margin:30px auto;padding:20px}
    .card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 8px 30px #0001;margin-bottom:20px}

    #loginCard{width:min(1000px,calc(100% - 24px));min-height:620px;margin:5vh auto;padding:0;overflow:hidden;display:grid;grid-template-columns:42% 58%;background:#0d0d0d;color:#fff;border:1px solid rgba(212,168,76,.55);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 50px rgba(212,168,76,.08)}
    .login-brand{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 25px;background:radial-gradient(circle at center,#292318 0%,#111 45%,#080808 100%);border-left:1px solid rgba(212,168,76,.25)}
    .login-brand:before{content:"";position:absolute;inset:25px;border:1px solid rgba(212,168,76,.18);border-radius:22px;pointer-events:none}
    .login-brand img{width:230px;max-width:80%;margin-bottom:20px;filter:drop-shadow(0 0 15px rgba(212,168,76,.25))}
    .login-brand h1{margin:0;color:#d8ad4e;font-family:Georgia,serif;font-size:29px;letter-spacing:3px}
    .login-brand p{color:#c9c0ad;font-size:14px;line-height:2;margin-top:15px}
    .login-gold-line{width:100px;height:1px;margin:5px auto 18px;background:linear-gradient(to right,transparent,#d8ad4e,transparent)}
    .login-content{display:flex;align-items:center;justify-content:center;padding:50px;background:#0d0d0d}
    .login-content-inner{width:100%;max-width:470px}
    .login-content h2{text-align:center;color:#fff;font-size:30px;font-weight:500;margin-bottom:8px}
    .login-subtitle{text-align:center;color:#d0a84e;margin-bottom:35px}
    .login-field{margin-bottom:20px}
    .login-field label{display:block;color:#d5c8ad;margin-bottom:8px;font-size:14px}
    .login-input{width:100%;height:58px;padding:0 18px;border-radius:10px;border:1px solid #4b3a20;background:#151515;color:#fff;font-size:16px;outline:none;direction:ltr}
    .login-input:focus{border-color:#d8ad4e;box-shadow:0 0 0 3px rgba(216,173,78,.10)}
    .login-options{display:flex;justify-content:space-between;align-items:center;margin:10px 0 25px;font-size:14px}
    .login-remember{display:flex;align-items:center;gap:8px;color:#cfc5b1}
    .login-remember input{accent-color:#d8ad4e;width:16px;height:16px}
    .login-forgot{color:#d8ad4e;text-decoration:none}
    .login-btn{width:100%;height:58px;border:0;border-radius:10px;background:linear-gradient(135deg,#e1b957,#b88628);color:#17100a;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(216,173,78,.22)}
    .login-btn:hover{filter:brightness(1.06)}
    .login-footer{text-align:center;color:#a79b88;margin-top:25px;font-size:12px}
    .login-error{display:none;color:#ff8f8f;text-align:center;margin-top:14px;font-size:13px}

    /* Mobile: stack vertically so the login card never becomes squeezed/cropped */
    @media (max-width:700px){
      body.login-mode{min-height:100dvh;overflow-x:hidden;overflow-y:auto;padding:18px 10px}
      #loginCard{width:100%;min-height:0;margin:10px auto;display:flex;flex-direction:column;border-radius:20px}
      .login-content{order:1;padding:34px 24px 28px}
      .login-brand{order:2;min-height:330px;padding:35px 20px;border-left:0;border-top:1px solid rgba(212,168,76,.25)}
      .login-brand:before{inset:18px;border-radius:18px}
      .login-brand img{width:150px;max-width:65%;margin-bottom:15px}
      .login-brand h1{font-size:24px;letter-spacing:2px}
      .login-brand p{font-size:13px;line-height:1.8;margin-top:12px}
      .login-content h2{font-size:29px;line-height:1.35;margin-bottom:8px}
      .login-subtitle{font-size:15px;line-height:1.7;margin-bottom:28px}
      .login-field{margin-bottom:16px}
      .login-input{height:54px;font-size:15px}
      .login-options{font-size:13px;margin:8px 0 20px;gap:10px}
      .login-btn{height:56px;font-size:17px}
    }
    @media (max-width:390px){
      body.login-mode{padding:10px 7px}
      #loginCard{margin:6px auto}
      .login-content{padding:28px 18px 24px}
      .login-content h2{font-size:26px}
      .login-brand{min-height:300px;padding:30px 16px}
      .login-brand h1{font-size:22px}
    }
  </style>
</head>
<body class="login-mode">
  <div id="loginCard">
    <div class="login-content">
      <div class="login-content-inner">
        <h2>مرحباً بك<br>في الإدارة</h2>
        <div class="login-subtitle">تسجيل الدخول إلى لوحة الإدارة</div>
        <form id="loginForm">
          <div class="login-field"><label for="email">البريد الإلكتروني</label><input id="email" class="login-input" type="email" placeholder="البريد الإلكتروني" required></div>
          <div class="login-field"><label for="password">كلمة المرور</label><input id="password" class="login-input" type="password" placeholder="كلمة المرور" required></div>
          <div class="login-options"><label class="login-remember"><input type="checkbox" id="remember"> تذكرني</label><a class="login-forgot" href="#">نسيت كلمة السر؟</a></div>
          <button class="login-btn" type="submit">🔐 تسجيل الدخول</button>
          <div id="loginError" class="login-error"></div>
        </form>
        <div class="login-footer">آمن ومحمي<br><br>naifuzu © 2026</div>
      </div>
    </div>
    <div class="login-brand">
      <img src="/logo.png" alt="Maison Al Teeb">
      <div class="login-gold-line"></div>
      <h1>MAISON AL TEEB</h1>
      <p>منتجات طبيعية<br>عالية الجودة<br>مستوحاة من الطبيعة لأجلك</p>
    </div>
  </div>
</body>
</html>
