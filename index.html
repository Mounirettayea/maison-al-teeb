<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | مَنْزِلُ الطِّيبْ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen">

    <!-- Navbar -->
    <nav class="bg-amber-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">لوحة إدارة المتجر - مَنْزِلُ الطِّيبْ</h1>
            <div id="authStatus" class="flex items-center space-x-4 space-x-reverse">
                <!-- Auth status will be loaded here -->
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Auth Form Section (Hidden when logged in) -->
        <div id="authSection" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-amber-100 mb-8">
            <h2 class="text-xl font-bold text-amber-900 mb-6 text-center">تسجيل الدخول للمسؤولين</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                    تسجيل الدخول
                </button>
            </form>
        </div>

        <!-- Dashboard Section (Hidden when logged out) -->
        <div id="dashboardSection" class="hidden space-y-8">
            
            <!-- Add / Edit Product Form -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-amber-100">
                <h2 id="formTitle" class="text-xl font-bold text-amber-900 mb-6">إضافة منتج جديد</h2>
                <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <input type="hidden" id="productId">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">الاسم بالعربية *</label>
                        <input type="text" id="nameAr" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">الاسم بالفرنسية</label>
                        <input type="text" id="nameFr" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">الاسم بالإنجليزية</label>
                        <input type="text" id="nameEn" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">السعر الحسابي/القديم (درهم)</label>
                        <input type="number" step="0.01" id="priceOld" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">السعر الحالي * (درهم)</label>
                        <input type="number" step="0.01" id="priceNew" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">الفئة (Category) *</label>
                        <select id="category" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                            <option value="perfumes">عطور ومسك</option>
                            <option value="oils">زيوت طبيعية</option>
                            <option value="care">عناية بالجسم والشعر</option>
                            <option value="clothes">لباس تقليدي</option>
                            <option value="supplements">مكملات غذائية</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">الحجم / السعة</label>
                        <input type="text" id="volume" placeholder="مثال: 50ml أو 100g" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">صورة المنتج</label>
                        <input type="file" id="imageFile" accept="image/*" class="w-full text-sm text-gray-500 border rounded-lg p-1">
                        <input type="hidden" id="imageUrl">
                    </div>

                    <div class="md:col-span-2 lg:col-span-3 flex gap-4">
                        <button type="submit" id="saveBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-6 rounded-lg transition">
                            حفظ المنتج
                        </button>
                        <button type="button" id="cancelBtn" onclick="resetForm()" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded-lg transition hidden">
                            إلغاء
                        </button>
                    </div>
                </form>
            </div>

            <!-- Products List Table -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-amber-100 overflow-x-auto">
                <h2 class="text-xl font-bold text-amber-900 mb-4">قائمة المنتجات الحالية</h2>
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-amber-50 text-amber-900 border-b">
                            <th class="p-3">الصورة</th>
                            <th class="p-3">الاسم بالعربية</th>
                            <th class="p-3">الفئة</th>
                            <th class="p-3">السعر</th>
                            <th class="p-3">الحجم</th>
                            <th class="p-3 text-center">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <!-- Products rendered dynamically -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        // Supabase Initialization (make sure to set your credentials)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const authSection = document.getElementById('authSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const authStatus = document.getElementById('authStatus');

        // Check authentication state on page load
        async function checkAuth() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                showDashboard(session.user);
            } else {
                showLoginForm();
            }
        }

        function showDashboard(user) {
            authSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            authStatus.innerHTML = `
                <span class="text-sm font-medium">${user.email}</span>
                <button onclick="logout()" class="bg-amber-950 hover:bg-black text-white text-xs px-3 py-1.5 rounded-lg transition">تسجيل الخروج</button>
            `;
            loadProducts();
        }

        function showLoginForm() {
            authSection.classList.remove('hidden');
            dashboardSection.classList.add('hidden');
            authStatus.innerHTML = '';
        }

        // Login Submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const { data, error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
                alert('خطأ في تسجيل الدخول: ' + error.message);
            } else {
                showDashboard(data.user);
            }
        });

        // Logout
        async function logout() {
            await db.auth.signOut();
            showLoginForm();
        }

        // Load Products
        async function loadProducts() {
            const { data: products, error } = await db.from('products').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error('Error fetching products:', error);
                return;
            }

            const tbody = document.getElementById('productsTableBody');
            tbody.innerHTML = '';

            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-3"><img src="${p.image_url || 'https://via.placeholder.com/50'}" class="w-12 h-12 object-cover rounded-md"></td>
                    <td class="p-3 font-semibold">${p.name_ar || ''}</td>
                    <td class="p-3 text-sm text-gray-600">${p.category || ''}</td>
                    <td class="p-3 font-bold text-amber-900">${p.price_new} د.م. ${p.price_old ? `<span class="line-through text-xs text-gray-400 mr-1">${p.price_old}</span>` : ''}</td>
                    <td class="p-3 text-sm">${p.volume || '-'}</td>
                    <td class="p-3 text-center space-x-2 space-x-reverse">
                        <button onclick="editProduct('${p.id}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded transition">تعديل</button>
                        <button onclick="deleteProduct('${p.id}')" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded transition">حذف</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Product Form Submit (Create / Update)
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('productId').value;
            const fileInput = document.getElementById('imageFile');
            let imageUrl = document.getElementById('imageUrl').value;

            // Handle Image Upload if a new file is chosen
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;
                
                const { data: uploadData, error: uploadError } = await db.storage.from('products').upload(fileName, file);
                if (uploadError) {
                    alert('خطأ في رفع الصورة: ' + uploadError.message);
                    return;
                }
                const { data: publicUrlData } = db.storage.from('products').getPublicUrl(fileName);
                imageUrl = publicUrlData.publicUrl;
            }

            const payload = {
                name_ar: document.getElementById('nameAr').value,
                name_fr: document.getElementById('nameFr').value,
                name_en: document.getElementById('nameEn').value,
                price_old: parseFloat(document.getElementById('priceOld').value) || null,
                price_new: parseFloat(document.getElementById('priceNew').value),
                category: document.getElementById('category').value,
                volume: document.getElementById('volume').value,
                image_url: imageUrl
            };

            let result;

            if (id) {
                // --- الجزء المستدرك والمصحح لقاعدة البيانات ---
                result = await db.from('products').update(payload).eq('id', id);
                
                // في حال كان المنتج موجود كعنصر افتراضي أولياً وليس مضافاً بعد في Supabase
                if (!result.error && (!result.data || result.data.length === 0)) {
                    // تجربة التنسيق كإدراج جديد في حال عدم وجود السجل
                    result = await db.from('products').insert([{ ...payload, id: id }]);
                }
            } else {
                result = await db.from('products').insert([payload]);
            }

            if (result.error) {
                alert('حدث خطأ أثناء حفظ المنتج: ' + result.error.message);
            } else {
                alert(id ? 'تم تحديث المنتج بنجاح!' : 'تم إضافة المنتج بنجاح!');
                resetForm();
                loadProducts();
            }
        });

        // Edit Product
        async function editProduct(id) {
            const { data: product, error } = await db.from('products').select('*').eq('id', id).single();
            if (error || !product) {
                alert('تعذر جلب بيانات المنتج');
                return;
            }

            document.getElementById('productId').value = product.id;
            document.getElementById('nameAr').value = product.name_ar || '';
            document.getElementById('nameFr').value = product.name_fr || '';
            document.getElementById('nameEn').value = product.name_en || '';
            document.getElementById('priceOld').value = product.price_old || '';
            document.getElementById('priceNew').value = product.price_new || '';
            document.getElementById('category').value = product.category || 'perfumes';
            document.getElementById('volume').value = product.volume || '';
            document.getElementById('imageUrl').value = product.image_url || '';

            document.getElementById('formTitle').innerText = 'تعديل المنتج';
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Delete Product
        async function deleteProduct(id) {
            if (!confirm('هل أنت تأكد من رغبتك في حذف هذا المنتج؟')) return;

            const { error } = await db.from('products').delete().eq('id', id);
            if (error) {
                alert('خطأ في حذف المنتج: ' + error.message);
            } else {
                loadProducts();
            }
        }

        // Reset Form
        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('formTitle').innerText = 'إضافة منتج جديد';
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        // Init
        checkAuth();
    </script>
</body>
</html>
