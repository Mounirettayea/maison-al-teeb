<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تغيير كلمة السر | MAISON AL TEEB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#080808;color:#fff;font-family:Arial,Tahoma,sans-serif}
.box{width:min(480px,100%);background:#111;border:1px solid #5a4520;border-radius:22px;padding:30px;box-shadow:0 30px 70px #000}
.logo{display:block;width:190px;max-width:75%;margin:0 auto 20px}.title{text-align:center;color:#d8ad4e;margin-bottom:24px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #4b3a20;background:#151515;color:#fff;margin-bottom:14px;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#e1b95e,#b88728);font-weight:700;font-size:16px;cursor:pointer}
.msg{margin-top:15px;text-align:center;padding:10px;border-radius:8px;color:#e9d9ae}
</style>
</head>
<body>
<div class="box">
<img src="/logo.png" class="logo" alt="MAISON AL TEEB">
<h1 class="title">تغيير كلمة السر</h1>
<form id="f">
<input id="p1" type="password" minlength="8" placeholder="كلمة السر الجديدة" required>
<input id="p2" type="password" minlength="8" placeholder="تأكيد كلمة السر الجديدة" required>
<button>حفظ كلمة السر</button>
<div id="m" class="msg"></div>
</form>
</div>
<script src="/supabase-config.js"></script>
<script>
const db=window.supabase.createClient(window.MAISON_SUPABASE.url,window.MAISON_SUPABASE.anonKey);
f.addEventListener('submit',async e=>{
e.preventDefault();m.textContent='';
if(p1.value.length<8){m.textContent='كلمة السر خاصها تكون 8 حروف على الأقل.';return}
if(p1.value!==p2.value){m.textContent='كلمتا السر غير متطابقتين.';return}
const {error}=await db.auth.updateUser({password:p1.value});
if(error){m.textContent=error.message;return}
m.textContent='تم تغيير كلمة السر بنجاح. يمكنك الآن الدخول.';
setTimeout(()=>location.href='/admin.html',1200);
});
</script>
</body>
</html>
